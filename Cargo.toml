[package]
name = "git-auto-commit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
dirs = "6.0.0"
git2 = { version = "0.20.4", features = ["vendored-libgit2"] }
indicatif = "0.18.4"
num-format = "0.4.4"
rustyline = "17.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3.0"
tempfile = "3.25.0"
ureq = { version = "3.2.0", features = ["json"] }
wait-timeout = "0.2.1"

[profile.release]
strip = true
debug = false
lto = true
codegen-units = 1
panic = "abort"
